# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy with: New → Blueprint → point at this repository.
# The start command lives here, so it can never be a stray value like "12".

services:
  - type: web
    name: shop-backend
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Migrations run on every start: a brand new database has no tables, and
    # without this the app returns 500 until somebody migrates by hand.
    startCommand: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn shop_backend.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers ${WEB_CONCURRENCY:-1}
      --threads ${WEB_THREADS:-4}
      --timeout 120"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: WEB_THREADS
        value: "4"
      # Uncomment to keep SQLite and uploaded images across redeploys.
      # Requires the disk block at the bottom (disks are a paid add-on).
      # - key: DATA_DIR
      #   value: /var/data
      #
      # For a permanent shared database use this instead:
      # - key: DATABASE_URL
      #   value: postgresql://USER:PASSWORD@HOST:5432/DBNAME

  # Uncomment together with DATA_DIR above to keep SQLite and uploaded
  # images across restarts. Disks are a paid add-on; the free plan has none.
  # - type: disk
  #   name: shop-data
  #   mountPath: /var/data
  #   sizeGB: 1
